  # ---------------- Ascidians and thaliaceans ----------------
  # UniProt holds only six tunicate proteomes (3x O. dioica, C. intestinalis, C. savignyi, Clavelina lepadiformis;
  # checked 2026-10-20). Everything else comes from NCBI RefSeq annotations via the datasets CLI. ANISEED download
  # links (Halocynthia, Molgula, Botrylloides, Phallusia) all redirect to the site index for scripted requests and
  # could not be verified; those species stay to-verify until a file is obtained by hand and checksummed.
  - key: Crob
    name: Ciona intestinalis
    taxid: 7719
    role: ascidian
    lineage: "Ciona robusta (type A): KH assembly and UniProt reference proteome UP000008144 (17,311 proteins, Ensembl KH gene models) are filed under NCBI taxid 7719 'Ciona intestinalis'; a separate taxid 1774208 'Ciona robusta' carries only the KH GCA_000224145.2 record"
    proteome: {source: uniprot_reference}
    genome: {source: ncbi_datasets, accession: GCF_000224145.3}   # KH, RefSeq Annotation Release 104 (13,726 protein-coding genes)
    note: "Alternative: Kyoto HT assembly GCA_009617815.2 with KY21 gene models (Ghost: https://ghost.zool.kyoto-u.ac.jp/datas/HT.KY21Gene.protein.2.fasta.zip, 13.9 MB, HEAD 200); no NCBI annotation for HT"
    status: verified

  - key: Cint
