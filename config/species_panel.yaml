# Species whose proteomes are used to collect ortholog seeds for per-gene HMMs (must have proteomes).
seed_species: [Hsap, Mmus, Xtro, Drer, Bflo, Crob, Crei, Tthe, Dmel, Cele]

# Species run through the genome-level search (miniprot) for every absence candidate.
genome_search_species: [Odio_OKI, Odio_OKI_hap, Odio_OSA, Odio_BCN, Odio_KUM, Odio_AOM, Odio_OdB3, Oalb, Olon, Ovan, Bsty, Mery, Fbor]
