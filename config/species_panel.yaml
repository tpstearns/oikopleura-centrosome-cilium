    proteome: {source: zenodo_archive, record: 12913342, archive: AugustusAnnotation.tar.gz, member: run_augustus/Mery_SCLF01.1.sm.abi.cionamodel/M_ery.prot.longest.fa}   # ab initio Augustus models (cionamodel) from the Plessy 2024 Zenodo supplement; uncurated, supplements the genome search
