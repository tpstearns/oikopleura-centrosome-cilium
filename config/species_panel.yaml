    proteome: {source: zenodo_archive, record: 12913342, archive: AugustusAnnotation.tar.gz, member: run_augustus/Bsty_SCLE01.1.sm.abi.cionamodel/B_sty.prot.longest.fa}   # ab initio Augustus models (cionamodel) from the Plessy 2024 Zenodo supplement; uncurated, supplements the genome search
